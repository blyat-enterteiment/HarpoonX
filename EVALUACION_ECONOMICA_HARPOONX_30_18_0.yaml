soluciones_priorizadas_no_ejecutadas:
- prioridad: 1
  accion: No promover la regla residual ni seleccionar post hoc STOCK_THRESHOLD_OFF
  motivo: La condición z/hurdle no mejoró su propio control; el nominal positivo del control no resiste estrés ni
    incertidumbre.
- prioridad: 2
  accion: Cerrar medición de costes, quotes y capacidad con registros originales
  motivo: Calibrar fricciones observadas y reconciliar ledger, sin bajar costes supuestos para volver positivo el
    histórico.
- prioridad: 3
  accion: Mantener asignación robusta con abstención, incertidumbre de media y covarianza regularizada
  motivo: Son defensas/controles de riesgo, no fuente demostrada de alpha; la familia30.17 ya quedó negativa.
- prioridad: 4
  accion: Una hipótesis residual verdaderamente cubierta requeriría nuevo diseño y datos de ambas patas/borrow,
    universo point-in-time y horizonte72h contrastado
  motivo: Avellaneda–Lee no valida automáticamente esta variante long-only; su reversión aproximadamente7d no prueba
    <=72h. No se lanzó otra familia tras el negativo.
- prioridad: 5
  accion: Modelar splits abiertos con inventario, órdenes ajustadas y cash-in-lieu bajo nueva revisión, antes de
    aplicar a periodos con cruces
  motivo: En esta muestra no hubo cruce; no implica soporte general de splits ni licencia para omitir incidentes.
- prioridad: 6
  accion: Opciones continúa DATA_BLOCKED
  motivo: Necesita cadenas históricas bid/ask, identificadores/multiplicadores/vencimientos, marks, assignment y
    colas; IV-RV por sí solo no es beneficio ejecutable.
