  - MSFT
  sector: XLK
  modelo: OLS intradía con intercepto; beta en [0,2], sigma sample ddof1. Rechazo fuera de contrato, sin clipping
    para crear señales.
  entry: Decisión open+60min+1s; entrada IOC modelada al siguiente open+65min.
  residual: Elegir menor z válido; z<=−1,5 y recuperación hipotética 0,5*(mu−e) mayor que fricción roundtrip+5bp;
    |z|>8 rehúsa.
  hurdle_es_prediccion_calibrada: false
  STOCK_THRESHOLD_OFF: 'Conserva exactamente ranking por menor z, hora, filtros de validez/drift, activos, sizing
    y salida. Elimina AMBOS requisitos: umbral z de entrada y hurdle de recuperación/costes. No es compra incondicional
    ni otro alpha aprobado.'
  SECTOR_TIMING_CONTROL: XLK en eventos propuestos por residual cuando ATR sector es válido; mismo presupuesto de
    riesgo, no mismo notional, fill, holding, beta ni exposición efectiva.
  CASH: 'Sin posiciones, misma cuenta/periodo/coste fijo modelado. No representa todo depósito bancario real: no
    se observa remuneración del efectivo ni facturas reales.'
  salida: Plantilla nativa CLOSED_CHANNEL:BASELINE sólo reutiliza stop/targets/deadline<=72h. Identidad económica
