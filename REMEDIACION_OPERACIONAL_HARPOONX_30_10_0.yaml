  estres_de_ingenieria:
  - Fallo disco/commit
  - Huérfano/corrupción de hash
  - Timeout de worker y saturación de cola
  - Fill parcial y cancelación tardía
  - Pausa/parada/bloqueo de broker
  - Dato futuro/obsoleto
  - Coste tardío/reloj real
  - Manipulación de protocolo, resultados o contador
  dictamen_del_fixture_estadistico: VENTAJA_NO_DEMOSTRADA
  paridad_replay:
    checks_verified:
    - execution_actions
    - positions_and_exit_state
    - account_cash_fees_and_costs
    - real_plugin_and_receipt_decisions
    - causal_fills
    complete_paired_policy_coverage: false
    covered_policies:
    - C0
    economic_bindings_verified: false
    execution_origin: MODELED
    external_validation: false
    financial_acceptance_allowed_by_receipt: false
    policy_parity_verified: true
    predictor_parity_verified: false
    real_coordinator_reexecuted: true
    receipt_integrity_verified: true
    receipt_predictor_parity_verified_within_its_scope: true
    scope:
      books:
      - equity
      components:
      - Coordinator.initialize
      - Coordinator.reconcile
      - Plugins.evaluate
      - Coordinator.entries
      - Coordinator.manage
      - policy.exitDecision
      - exits
      entry_predictor: NATIVE_C0
      event_types:
      - entries
      - evaluate
      - manage
      - market
      - reconcile
      execution_model: EXPLICIT_MODELED_CROSSING_AND_LIQUIDITY
      inventory: LONG_ONLY_CASH
      native_protection: stop
      not_covered:
      - live_broker_execution
      - queue_priority
      - hidden_liquidity
      - options
      - native_oco
      - shorts
      - production_scheduler_concurrency
      - empirical_model_edge
      - exhaustive_multiasset_parity
      observation_adapter: null
      restart_count: 0
  incremento_evidencia_empirica_por_simular: false
incertidumbre_y_limitaciones:
  rentabilidad_real: null
  probabilidad_de_ser_ganador: null
  efecto_economico_de_las_remediaciones: null
  no_estimable_con: Pruebas de software, fixtures sintéticos y ausencia de datos de cuenta actual.
  bootstrap: Pareado por bloques de cartera/sesión; corrección Bonferroni preregistrada; cobertura aproximada bajo dependencia
    apropiada, no garantía futura.
  retencion_ledger: 10000 marcas y 32 MiB por defecto; aproximadamente 6,94 días a una marca/min. No se implementó archivador
    del ledger contable.
  retencion_observaciones: Archivado automático de índices con 16 segmentos y 512 MiB predeterminados; límites explícitos,
    sin borrado de evidencia.
  datos_pendientes:
  - Cuenta/despliegue/logs actuales
  - Costes externos auténticos y madurez de cargos reportados
  - Curvas C0/Ridge/SVR observadas y comparables
  - Paridad predictiva reproducible
  - Ejecución representativa/capacidad/latencia
  - Definición y vinculación inequívoca de cada política de control
  construccion_pendiente:
  - Productor completo de trayectorias financiadas para optimizer
  - Archivado contable automático verificable
  - Entrenamiento/promoción automática validada dentro de permisos
  autonomia_economica_indefinida: false
  revision_por_agentes: Revisión cruzada con el mismo workspace; no validación externa ni ciega.
