name: FWN9 P9M-B offline source panel
on:
  push:
    paths:
      - 'quant/harpoon_quant/fwn9_source_panel.py'
      - 'quant/tests/test_fwn9_source_panel.py'
      - 'research/modulation11/fwn9_phase9m_b_protocol.json'
      - '.github/workflows/fwn9_phase9m_b.yml'
  pull_request:
    paths:
      - 'quant/harpoon_quant/fwn9_source_panel.py'
      - 'quant/tests/test_fwn9_source_panel.py'
permissions:
  contents: read
jobs:
  offline-panel:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: quant
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r quant/requirements-roadmap9.txt
      - run: python3 -m pip install cryptography==46.0.4 ruff==0.17.3 mypy==2.4.1
      - run: |
          python3 -m ruff check --select E4,E7,E9,F quant/harpoon_quant/fwn9_source_panel.py quant/tests/test_fwn9_source_panel.py
          MYPYPATH=quant python3 -m mypy --follow-imports=silent --ignore-missing-imports --explicit-package-bases quant/harpoon_quant/fwn9_source_panel.py
          python3 -m compileall -q quant/harpoon_quant/fwn9_source_panel.py quant/tests/test_fwn9_source_panel.py
          python3 -m unittest quant.tests.test_fwn9_source_panel -v
