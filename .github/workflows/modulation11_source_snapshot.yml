name: M11 read-only engineering source snapshot
on:
  push:
    branches: [codex/continuous-n9-research]
    paths: [.github/workflows/modulation11_source_snapshot.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Package source only, without credentials, Git metadata or market results
        shell: python
        run: |
          import hashlib, json, pathlib, zipfile
          root = pathlib.Path.cwd()
          names = set()
          for folder in ('runtime30', 'quant/harpoon_quant', 'quant/tests', 'tools', 'research/modulation9', 'research/modulation10', 'research/modulation11', 'research/continuous_n9'):
              for p in (root / folder).rglob('*'):
                  if p.is_file() and p.suffix in ('.py', '.js', '.cjs', '.mjs', '.json', '.txt', '.md') and '__pycache__' not in p.parts:
                      names.add(p.relative_to(root).as_posix())
          for p in (root / 'docs').glob('MODULATION*.md'):
              names.add(p.relative_to(root).as_posix())
          for name in ('pyproject.toml', 'package.json', 'tsconfig.json'):
              if (root / name).is_file(): names.add(name)
          hashes = {name: hashlib.sha256((root / name).read_bytes()).hexdigest() for name in sorted(names)}
          out = pathlib.Path('/tmp/m11-source'); out.mkdir()
          (out / 'SHA256.json').write_text(json.dumps(hashes, indent=2, sort_keys=True) + '\n')
          with zipfile.ZipFile(out / 'source.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for name in sorted(names): archive.write(root / name, name)
          print(json.dumps({'source_files': len(names), 'economic_accounts': 0, 'source_archive_sha256': hashlib.sha256((out / 'source.zip').read_bytes()).hexdigest()}))
      - uses: actions/upload-artifact@v4
        with:
          name: m11-engineering-source-${{ github.sha }}
          path: /tmp/m11-source/
          retention-days: 14
