name: FWN9 phase9F inverse-wealth tail lemma
on:
  push:
    branches: [codex/continuous-n9-research]
    paths:
      - tools/fwn9_phase9f_tail_bounds.py
      - tools/test_fwn9_phase9f_tail_bounds.py
      - tools/fwn9_phase9f_independent.py
      - research/modulation11/fwn9_phase9f_protocol.json
      - .github/workflows/fwn9_phase9f.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tail-lemma:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax, exact-fraction falsification tests and independent Decimal
        run: |
          python -m py_compile tools/fwn9_phase9f_tail_bounds.py tools/test_fwn9_phase9f_tail_bounds.py tools/fwn9_phase9f_independent.py
          PYTHONPATH=tools python -m unittest -v test_fwn9_phase9f_tail_bounds
          python -B tools/fwn9_phase9f_independent.py
      - name: Static code quality and scoped type-check
        run: |
          python -m pip install --disable-pip-version-check 'ruff==0.14.4' 'mypy==1.18.2'
          ruff check --select E4,E7,E9,F tools/fwn9_phase9f_tail_bounds.py tools/test_fwn9_phase9f_tail_bounds.py tools/fwn9_phase9f_independent.py
          mypy --strict tools/fwn9_phase9f_tail_bounds.py tools/fwn9_phase9f_independent.py
      - name: Verify preregistered source hashes and M9 generator
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,subprocess
          reg=json.loads(pathlib.Path('research/modulation11/fwn9_phase9f_protocol.json').read_text())
          assert reg['budget']['new_accounts']==0 and reg['budget']['final_m10_unopened']==3200
          for path,sha in reg['git_blobs'].items():
              assert subprocess.check_output(['git','hash-object',path],text=True).strip()==sha,path
              print('SHA256',path,hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest())
          old=json.loads(pathlib.Path('research/modulation9/registration.json').read_text())
          src='quant/harpoon_quant/modulation9.py'
          assert hashlib.sha256(pathlib.Path(src).read_bytes()).hexdigest()==old['sources_sha256'][src]
          print('P9F_FROZEN_M9_GENERATOR_OK')
          PY
      - name: Bounded benchmark of 2000 finite laws
        run: |
          PYTHONPATH=tools python - <<'PY'
          import time
          from fractions import Fraction as F
          from fwn9_phase9f_tail_bounds import audit_finite_law,rare_near_ruin_law
          rows=rare_near_ruin_law(F(1,2))
          tic=time.perf_counter()
          for _ in range(2000):
              audit_finite_law(rows,F(1))
          print('P9F_2000_MOMENT_AUDITS_MS=',round((time.perf_counter()-tic)*1000,4))
          PY
