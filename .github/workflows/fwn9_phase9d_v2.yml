name: FWN9 phase9D v2 native mark and receipt convergence
on:
  push:
    branches: [codex/continuous-n9-research]
    paths:
      - runtime30/fwn9_native_mark_convergence_p9d_v2.cjs
      - tools/fwn9_phase9d_test_v2.cjs
      - tools/fwn9_phase9d_accountant_v2.py
      - research/modulation11/fwn9_phase9d_v2_protocol.json
      - .github/workflows/fwn9_phase9d_v2.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-mark-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and adversarial native-mark tests
        run: |
          node --check runtime30/fwn9_native_mark_convergence_p9d_v2.cjs
          node --check tools/fwn9_phase9d_test_v2.cjs
          python -m py_compile tools/fwn9_phase9d_accountant_v2.py
          node --test tools/fwn9_phase9d_test_v2.cjs
      - name: Independent Decimal accounting and native mark reconstruction
        run: |
          node tools/fwn9_phase9d_test_v2.cjs --emit-audit >/tmp/p9d_audit.log
          python -B tools/fwn9_phase9d_accountant_v2.py /tmp/p9d_audit.log
      - name: Static typecheck limited to new module
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          set +e
          ./node_modules/.bin/tsc --allowJs --checkJs --noEmit --skipLibCheck --target ES2022 --module node16 --types node runtime30/fwn9_native_mark_convergence_p9d_v2.cjs >/tmp/p9d_types.log 2>&1
          rc=$?
          set -e
          TSC_STATUS="$rc" python - <<'PY'
          import os,pathlib
          errors=[s for s in pathlib.Path('/tmp/p9d_types.log').read_text().splitlines() if 'error TS' in s]
          if int(os.environ['TSC_STATUS'])==0:
              assert not errors,errors
              print('FWN9_P9D_TYPES_PASS')
          else:
              assert int(os.environ['TSC_STATUS'])==2
              assert len(errors)==8,errors
              assert all(x.startswith('runtime30/types.js(') and ': error TS2365:' in x and
                         x.split('(')[1].split(',')[0] in ('85','94','115','151') for x in errors),errors
              print('FWN9_P9D_NO_NEW_TYPES_8_HISTORICAL')
          PY
      - name: Verify frozen sources and preregistered Git objects
        run: |
          python - <<'PY'
          import json,pathlib,subprocess,hashlib
          root=pathlib.Path('.')
          p=json.loads((root/'research/modulation11/fwn9_phase9d_v2_protocol.json').read_text())
          assert p['budget']=={'economic_accounts':0,'new_candidate_recipes':0,'workers':1,'alpha_spent':0,'final_accounts_unopened':3200}
          for path,sha in p['code_git_blob_sha1'].items():
              actual=subprocess.check_output(['git','hash-object',path],text=True).strip()
              assert actual==sha,(path,actual,sha)
              print('FWN9_P9D_SHA256',path,hashlib.sha256((root/path).read_bytes()).hexdigest())
          reg=json.loads((root/'research/modulation9/registration.json').read_text())
          src='quant/harpoon_quant/modulation9.py'
          assert hashlib.sha256((root/src).read_bytes()).hexdigest()==reg['sources_sha256'][src]
          print('FWN9_P9D_M9_GENERATOR_INTACT')
          PY
      - name: Bounded benchmark
        run: |
          node tools/fwn9_phase9d_test_v2.cjs --bench >/tmp/p9d_bench.log
          grep 'FWN9_P9D_10_AUDITS_MS=' /tmp/p9d_bench.log
