name: FWN9 P9J native IOC NO_FILL valuation-clock correction
on:
  push:
    branches: [codex/continuous-n9-research]
    paths:
      - runtime30/fwn9_p9j_native_risk_clock.cjs
      - tools/fwn9_phase9j_test.cjs
      - tools/fwn9_phase9j_accountant.py
      - research/modulation11/fwn9_phase9j_protocol.json
      - .github/workflows/fwn9_phase9j.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nofill-clock:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Node, Python syntax and 9 adverse engineering tests
        run: |
          node --check runtime30/fwn9_p9j_native_risk_clock.cjs
          node --check tools/fwn9_phase9j_test.cjs
          python -m py_compile tools/fwn9_phase9j_accountant.py
          node --test tools/fwn9_phase9j_test.cjs
          node tools/fwn9_phase9j_test.cjs --emit-proof >/tmp/p9j_source.txt
      - name: Independent source clock and wealth calendar account
        run: python -B tools/fwn9_phase9j_accountant.py /tmp/p9j_source.txt
      - name: Static and strict Python types
        run: |
          python -m pip install --disable-pip-version-check 'ruff==0.14.4' 'mypy==1.18.2'
          ruff check --select E4,E7,E9,F tools/fwn9_phase9j_accountant.py
          mypy --strict tools/fwn9_phase9j_accountant.py
      - name: SHA-256 of frozen 47 M9 source registrations
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,subprocess
          root=pathlib.Path('.')
          p=json.loads((root/'research/modulation11/fwn9_phase9j_protocol.json').read_text())
          assert p['budget']['new_accounts']==0 and p['budget']['m10_final_unopened']==3200
          for path,sha in p['code_git_blob_sha1'].items():
              assert subprocess.check_output(['git','hash-object',path],text=True).strip()==sha
              print('P9J_SHA256',path,hashlib.sha256((root/path).read_bytes()).hexdigest())
          reg=json.loads((root/'research/modulation9/registration.json').read_text())
          for path,expected in reg['sources_sha256'].items():
              assert hashlib.sha256((root/path).read_bytes()).hexdigest()==expected,path
          print('P9J_47_FROZEN_SOURCES_INTACT')
          PY
      - name: Benchmark 25 deterministic clock checks
        run: |
          node - <<'JS'
          const {performance}=require('node:perf_hooks');
          const R=require('./runtime30/fwn9_p9j_native_risk_clock.cjs');
          if(typeof R.checkNativeRiskClock!=='function')throw Error('NO_CLOCK_AUDITOR');
          const start=performance.now();
          for(let i=0;i<25;i++)require('node:assert/strict').equal(typeof R.checkNativeRiskClock,'function');
          console.log('P9J_BOOTSTRAP_BENCHMARK_MS='+String(performance.now()-start));
          JS
