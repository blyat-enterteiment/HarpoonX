name: Robust quant core regressions
on:
  push:
    paths:
      - 'quant/harpoon_quant/**'
      - 'quant/tests/**'
      - 'tools/review_compound_evidence.py'
      - 'tools/run_technical_swing.py'
      - 'tools/run_compound_swing.py'
      - 'tools/multisector_replay.cjs'
      - 'tools/verify_swing8.py'
      - 'runtime/quant_bridge.cjs'
      - 'tools/fwn9_p9i_partitioned_regressions.py'
      - 'tools/fwn9_p9i_provenance.py'
      - 'tools/fwn9_p9i_composite_lineage.py'
      - 'research/modulation11/fwn9_phase9i_r4_protocol.json'
      - '.github/workflows/robust-quant-core.yml'
  pull_request:
    paths:
      - 'quant/harpoon_quant/**'
      - 'quant/tests/**'
      - 'tools/review_compound_evidence.py'
      - 'tools/run_technical_swing.py'
      - 'tools/run_compound_swing.py'
      - 'tools/multisector_replay.cjs'
      - 'tools/verify_swing8.py'
      - 'runtime/quant_bridge.cjs'
      - '.github/workflows/robust-quant-core.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quant:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: quant
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            quant/requirements-tested.txt
            quant/requirements-roadmap9.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: python3 -m pip install -r quant/requirements-roadmap9.txt
      - name: Qualification static and type checks
        run: |
          python3 -m pip install ruff==0.17.3 mypy==2.4.1
          python3 -m ruff check quant/harpoon_quant/remediation.py quant/harpoon_quant/qualification.py quant/tests/test_qualification.py quant/tests/test_remediation.py tools/review_compound_evidence.py
          MYPYPATH=quant:tools python3 -m mypy --follow-imports=silent --ignore-missing-imports --explicit-package-bases quant/harpoon_quant/remediation.py quant/harpoon_quant/qualification.py tools/review_compound_evidence.py
          python3 -m ruff check quant/harpoon_quant/framework.py quant/harpoon_quant/swing_evidence.py quant/harpoon_quant/__main__.py quant/tests/test_framework.py
          MYPYPATH=quant:tools python3 -m mypy --follow-imports=silent --ignore-missing-imports --explicit-package-bases quant/harpoon_quant/framework.py quant/harpoon_quant/swing_evidence.py quant/harpoon_quant/__main__.py
          node --check runtime/quant_bridge.cjs
          python3 -m ruff check --select E4,E7,E9,F tools/fwn9_p9i_partitioned_regressions.py
          MYPYPATH=tools python3 -m mypy --strict tools/fwn9_p9i_partitioned_regressions.py
      - name: Current-head quant suite, excluding ONLY separately retained 12 archive tests
        run: python3 -B tools/fwn9_p9i_partitioned_regressions.py --current
      - name: Historical archive suite, independently reconstructed from immutable byte refs
        run: python3 -B tools/fwn9_p9i_partitioned_regressions.py --archive
