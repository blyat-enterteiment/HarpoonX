name: Robust quant core regressions
on:
  push:
    paths:
      - 'quant/harpoon_quant/**'
      - 'quant/tests/**'
      - 'tools/review_compound_evidence.py'
      - 'tools/run_technical_swing.py'
      - 'tools/run_compound_swing.py'
      - 'tools/multisector_replay.cjs'
      - 'tools/verify_swing8.py'
      - 'runtime/quant_bridge.cjs'
      - 'tools/fwn9_p9i_partitioned_regressions.py'
      - 'tools/fwn9_p9i_partitioned_regressions_r5.py'
      - 'tools/fwn9_p9i_provenance.py'
      - 'tools/fwn9_p9i_operational_test.cjs'
      - 'runtime30/fwn9_p9i_operational_gate.cjs'
      - 'runtime30/fwn9_p9j_native_risk_clock.cjs'
      - 'runtime30/fwn9_p9k_fault_matrix.cjs'
      - 'runtime30/fwn9_p9k_fault_matrix_r2.cjs'
      - 'tools/fwn9_p9k_fault_matrix_test_r2.cjs'
      - 'research/modulation11/fwn9_phase9k_r2_protocol.json'
      - 'tools/fwn9_p9k_fault_matrix_test.cjs'
      - 'tools/fwn9_p9k_accountant.py'
      - 'research/modulation11/fwn9_phase9k_protocol.json'
      - 'tools/fwn9_phase9j_test.cjs'
      - 'tools/fwn9_phase9j_accountant.py'
      - 'research/modulation11/fwn9_phase9j_protocol.json'
      - 'tools/fwn9_p9i_composite_lineage.py'
      - 'research/modulation11/fwn9_phase9i_r4_protocol.json'
      - 'research/modulation11/fwn9_phase9i_r5_protocol.json'
      - 'research/modulation11/fwn9_phase9i_r6_protocol.json'
      - '.github/workflows/robust-quant-core.yml'
  pull_request:
    paths:
      - 'quant/harpoon_quant/**'
      - 'quant/tests/**'
      - 'tools/review_compound_evidence.py'
      - 'tools/run_technical_swing.py'
      - 'tools/run_compound_swing.py'
      - 'tools/multisector_replay.cjs'
      - 'tools/verify_swing8.py'
      - 'runtime/quant_bridge.cjs'
      - '.github/workflows/robust-quant-core.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quant:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: quant
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            quant/requirements-tested.txt
            quant/requirements-roadmap9.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: python3 -m pip install -r quant/requirements-roadmap9.txt
      - name: Qualification static and type checks
        run: |
          python3 -m pip install ruff==0.17.3 mypy==2.4.1
          python3 -m ruff check quant/harpoon_quant/remediation.py quant/harpoon_quant/qualification.py quant/tests/test_qualification.py quant/tests/test_remediation.py tools/review_compound_evidence.py
          MYPYPATH=quant:tools python3 -m mypy --follow-imports=silent --ignore-missing-imports --explicit-package-bases quant/harpoon_quant/remediation.py quant/harpoon_quant/qualification.py tools/review_compound_evidence.py
          python3 -m ruff check quant/harpoon_quant/framework.py quant/harpoon_quant/swing_evidence.py quant/harpoon_quant/__main__.py quant/tests/test_framework.py
          MYPYPATH=quant:tools python3 -m mypy --follow-imports=silent --ignore-missing-imports --explicit-package-bases quant/harpoon_quant/framework.py quant/harpoon_quant/swing_evidence.py quant/harpoon_quant/__main__.py
          node --check runtime/quant_bridge.cjs
          MYPYPATH=tools python3 -m mypy --strict tools/fwn9_p9k_accountant.py
          python3 -m ruff check --select E4,E7,E9,F tools/fwn9_p9i_partitioned_regressions_r5.py
          MYPYPATH=tools python3 -m mypy --strict tools/fwn9_p9i_partitioned_regressions_r5.py
      - name: P9I hard-gate knownAt, cash, IOC no-fill and versioned provenance
        run: |
          node --check runtime30/fwn9_p9i_operational_gate.cjs
          node --test tools/fwn9_p9i_operational_test.cjs
          python3 -B tools/fwn9_p9i_provenance.py >/tmp/p9i_versioned.json
          python3 -B tools/fwn9_p9i_composite_lineage.py >/tmp/p9i_composite.json
          python3 - <<'PY'
          import json
          v=json.load(open('/tmp/p9i_versioned.json'))
          c=json.load(open('/tmp/p9i_composite.json'))
          assert v['provenance']['distinct_versions_verified']
          assert v['provenance']['all_sources_covered']
          assert c['composite_bytes_verified'] is True
          assert c['atomic_snapshot_verified'] is False
          assert v['promotion']['status']=='BLOCKED'
          assert c['n9s_certified'] is False
          print('P9I_REQUIRED_DIAGNOSTIC_GATE_PASS_NO_N9_PROMOTION')
          PY
      - name: P9J blocking IOC NO_FILL receipt and valuation event-clock tests
        run: |
          node --check runtime30/fwn9_p9j_native_risk_clock.cjs
          node --test tools/fwn9_phase9j_test.cjs
          node tools/fwn9_phase9j_test.cjs --emit-proof >/tmp/p9j_integrated.txt
          python3 -B tools/fwn9_phase9j_accountant.py /tmp/p9j_integrated.txt
      - name: P9K blocking multi-layer shared capital and fault-path checks
        run: |
          node --check runtime30/fwn9_p9k_fault_matrix_r2.cjs
          node --test tools/fwn9_p9k_fault_matrix_test_r2.cjs
          node tools/fwn9_p9k_fault_matrix_test_r2.cjs --emit-audit >/tmp/p9k_gate_audit.txt
          python3 -B tools/fwn9_p9k_accountant.py /tmp/p9k_gate_audit.txt
      - name: Current-head quant suite, excluding ONLY separately retained 12 archive tests
        run: python3 -B tools/fwn9_p9i_partitioned_regressions_r5.py --current
      - name: Historical archive suite, independently reconstructed from immutable byte refs
        run: python3 -B tools/fwn9_p9i_partitioned_regressions_r5.py --archive
