name: N10 four-month real options offline diagnostic
on:
  push:
    branches: [codex/n10-options-real-4mo-2025]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-options:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dataframe parquet and static validation tools
        run: python -m pip install pandas==2.2.3 pyarrow==19.0.1 numpy==2.2.4 ruff==0.11.10
      - name: Compile and scoped static checks
        run: |
          python -m compileall -q tools/n10_real_4mo.py
          ruff check --select E4,E7,E9,F63,F7,F82 tools/n10_real_4mo.py
      - name: Download pinned real public source, verify original Git hashes and run fixed 4-month test
        run: |
          PYTHONPATH=. python tools/n10_real_4mo.py > n10_real4mo_stdout.json
          python -m json.tool _n10_real4mo/evidence.json > /dev/null
          cat n10_real4mo_stdout.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: n10-real-spy-options-2025-jan-apr
          path: |
            _n10_real4mo/SPY_options_2025_JanApr_source_window.parquet
            _n10_real4mo/evidence.json
            _n10_real4mo/trade_log.csv
            _n10_real4mo/continuous_ledger.csv
            n10_real4mo_stdout.json
          retention-days: 30
          if-no-files-found: warn
