name: FWN9 C16 actual native A/U pathwise observer and independent Decimal46
on:
  push:
    branches: [research/m11-c16-native-au-observer]
    paths:
      - 'runtime30/fwn9_p9m_c16_native_au_bridge.cjs'
      - 'tools/fwn9_p9m_c16_native_au_test.cjs'
      - 'tools/fwn9_p9m_c16_decimal_accountant.py'
      - 'tools/fwn9_p9m_c16_c15_handoff.py'
      - 'research/modulation11/fwn9_phase9m_c16_protocol.json'
      - '.github/workflows/fwn9_p9m_c16.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  native-au-observer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source syntax and independent Python quality
        run: |
          node --check runtime30/fwn9_p9m_c16_native_au_bridge.cjs
          node --check tools/fwn9_p9m_c16_native_au_test.cjs
          python -m pip install --disable-pip-version-check ruff==0.14.7 mypy==1.18.2
          python -m py_compile tools/fwn9_p9m_c16_decimal_accountant.py tools/fwn9_p9m_c16_c15_handoff.py
          ruff check tools/fwn9_p9m_c16_decimal_accountant.py tools/fwn9_p9m_c16_c15_handoff.py
          mypy --strict tools/fwn9_p9m_c16_decimal_accountant.py tools/fwn9_p9m_c16_c15_handoff.py
      - name: Real native replay reused C14 fixture and negative controls
        run: node --test tools/fwn9_p9m_c16_native_au_test.cjs
      - name: Independent Decimal46 bar/event/cash reconstruction
        run: |
          set -o pipefail
          node tools/fwn9_p9m_c16_native_au_test.cjs --emit-c16 > /tmp/c16_native.log
          python -B tools/fwn9_p9m_c16_decimal_accountant.py /tmp/c16_native.log
      - name: Verified native A/U to C15 fail-closed economic handoff
        run: |
          python -B tools/fwn9_p9m_c16_c15_handoff.py /tmp/c16_native.log research/modulation9/protocol.json > /tmp/c16_c15.log
          python - <<'PY'
          import json
          from pathlib import Path
          text=Path('/tmp/c16_c15.log').read_text()
          obj=json.loads(text.split('FWN9_C16_C15_HANDOFF=',1)[1])
          assert obj['N9SAdmission']=='NO_GO'
          assert obj['independent_recalculation']['matches_native_source']
          assert obj['population_C15_screens']['NOMINAL']['expected_A_upper'] is None
          assert obj['population_C15_screens']['NOMINAL']['expected_U_upper'] is None
          assert obj['population_C15_screens']['STRESS']['math_exclusion_if_inputs_proved'] is None
          assert obj['may_enable_recursive_search'] is False
          print('C16_C15_HANDOFF_BLOCKS_FALSE_POPULATION_PROMOTION_PASS')
          PY
      - name: Adversarial evidence tampering detected independently
        run: |
          python - <<'PY'
          import copy, json, sys
          from pathlib import Path
          sys.path.insert(0,'tools')
          from fwn9_p9m_c16_decimal_accountant import audit
          lines=Path('/tmp/c16_native.log').read_text().splitlines()
          data=json.loads(next(x.split('=',1)[1] for x in lines if x.startswith('FWN9_C16_NATIVE_AU_EVIDENCE=')))
          for key in ('AObservedPathUpperDollarSubsteps','UObservedPathPositiveCreditUpperUsd','terminalCashUsd'):
              wrong=copy.deepcopy(data)
              wrong[key]+=100
              try:
                  audit(wrong)
              except AssertionError:
                  pass
              else:
                  raise AssertionError('C16_INDEPENDENT_TAMPER_UNDETECTED_'+key)
          print('C16_THREE_INDEPENDENT_TAMPER_CONTROLS_PASS')
          PY
      - name: Original frozen M9 Git blobs and budget parity
        run: |
          python - <<'PY'
          import json,pathlib,hashlib
          from pathlib import Path
          root=Path('.')
          p=json.loads((root/'research/modulation11/fwn9_phase9m_c16_protocol.json').read_text())
          assert p['budget']=={'new_candidate_signals':0,'new_market_seeds':0,'new_economic_accounts':0,'final_M10_unopened':3200,'prospective_alpha':0}
          raw=(root/'research/modulation9/protocol.json').read_bytes()
          header=f'blob {len(raw)}\0'.encode()
          assert hashlib.sha1(header+raw).hexdigest()==p['source_contract']['m9_protocol_git_blob_sha1']
          registered=json.loads((root/'research/modulation9/registration.json').read_text())
          for path in ('quant/harpoon_quant/modulation9.py','runtime30/profit8_replay.js','runtime30/ultimate_reservations.js'):
              assert hashlib.sha256((root/path).read_bytes()).hexdigest()==registered['sources_sha256'][path],path
          print('C16_ORIGINAL_NATIVE_GENERATOR_RESERVATIONS_SOURCE_HASH_PASS')
          PY
      - name: 200 repetitions of read-only native A/U audit (not a trading benchmark)
        run: |
          node tools/fwn9_p9m_c16_native_au_test.cjs --bench |
            grep '^C16_BENCH_200_NATIVE_AU_AUDITS_MS='
