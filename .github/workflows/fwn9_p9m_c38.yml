name: FWN9 C38 five-level price grid and two-step stop-veto
on:
  push:
    branches:
      - research/m11-c38-five-level-stop-veto
  pull_request:
    branches:
      - research/m11-c36-frozen-safe-incubator
  workflow_dispatch:
permissions:
  contents: read
jobs:
  c38-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned static analysis
        run: python -m pip install --disable-pip-version-check ruff==0.17.3 mypy==2.4.1
      - name: Static compile and strict typing
        run: |
          python -m py_compile quant/harpoon_quant/five_level_guard.py quant/harpoon_quant/five_level_journal.py quant/tests/test_m11_five_level_guard.py quant/tests/test_m11_five_level_journal.py
          ruff check quant/harpoon_quant/five_level_guard.py quant/harpoon_quant/five_level_journal.py quant/tests/test_m11_five_level_guard.py quant/tests/test_m11_five_level_journal.py
          mypy --strict --follow-imports=silent quant/harpoon_quant/five_level_guard.py quant/harpoon_quant/five_level_journal.py
      - name: C38 price ladder, stop veto, gap-risk, broker nonexecution and journal
        run: PYTHONPATH=quant python -m unittest discover -s quant/tests -p 'test_m11_five_level*.py' -v
      - name: Preserve original C36 cost and compound gates
        run: PYTHONPATH=quant python -m unittest discover -s quant/tests -p 'test_m11_incubation_matrix.py' -v
      - name: Preserve immutable registered M9 identity
        run: python tools/fwn9_p9i_provenance.py
