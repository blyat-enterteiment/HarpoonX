name: C51 preregistered dual clock (no new market observations)
on:
  push:
    branches: [research/m11-c51-preregister-dual-clock]
  pull_request:
    branches: [research/m11-c49-risk-funded-pyramid]
permissions:
  contents: read
jobs:
  prereg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install ruff==0.17.3 mypy==2.4.1
          python -m py_compile research/raptor51/*.py
          ruff check --select E4,E7,E9,F research/raptor51
          mypy --strict research/raptor51/dual_clock.py
      - run: PYTHONPATH=research/raptor51 python -m unittest discover -s research/raptor51 -p test_dual_clock.py -v
      - run: |
          python - <<'PY'
          import json
          p=json.load(open("research/raptor51/FROZEN_BEFORE_NEW_COHORT.json"))
          assert p["status"]=="PREREGISTRATION_ONLY_NO_OUTCOME_OBSERVED"
          assert p["screening"]["late_filter_never_required_for_early_signal"]
          assert p["N9S"]=="NO_GO" and p["N10"]=="NO_GO"
          assert p["frozen_risk"]["no_overrides"]
          PY
      - run: python tools/fwn9_p9i_provenance.py
