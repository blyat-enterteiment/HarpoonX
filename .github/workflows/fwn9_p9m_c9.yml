name: C9 native-event induction engineering
on:
  push:
    branches: [codex/continuous-n9-research]
    paths:
      - 'runtime30/fwn9_p9m_c9_event_induction.cjs'
      - 'tools/fwn9_p9m_c9_event_induction_test.cjs'
      - '.github/workflows/fwn9_p9m_c9.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Syntax
        run: |
          node --check runtime30/fwn9_p9m_c9_event_induction.cjs
          node --check tools/fwn9_p9m_c9_event_induction_test.cjs
      - name: Native engineering invariants
        run: node --test tools/fwn9_p9m_c9_event_induction_test.cjs
      - name: Benchmark
        run: node tools/fwn9_p9m_c9_event_induction_test.cjs --bench
      - name: Evidence JSON
        run: node tools/fwn9_p9m_c9_event_induction_test.cjs --emit
