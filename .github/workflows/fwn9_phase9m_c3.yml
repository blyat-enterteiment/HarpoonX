name: FWN9 P9M-C3 finite causal event-surface bridge
on:
  push:
    branches: [codex/continuous-n9-research]
    paths:
      - 'runtime30/fwn9_p9m_c3_surface_bridge.cjs'
      - 'tools/fwn9_p9m_c3_test.cjs'
      - 'research/modulation11/fwn9_phase9m_c3_protocol.json'
      - '.github/workflows/fwn9_phase9m_c3.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finite-causal-surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax and source hashes
        run: |
          node --check runtime30/fwn9_p9m_c3_surface_bridge.cjs
          node --check tools/fwn9_p9m_c3_test.cjs
          sha256sum runtime30/fwn9_p9m_c3_surface_bridge.cjs tools/fwn9_p9m_c3_test.cjs research/modulation11/fwn9_phase9m_c3_protocol.json
      - name: Finite catalog and adversarial mutation tests
        run: node --test tools/fwn9_p9m_c3_test.cjs
      - name: Existing independent accountants and type checks
        run: |
          python -m pip install --disable-pip-version-check --quiet ruff mypy
          ruff check tools/fwn9_p9m_c2_accountant_r5.py
          mypy --strict tools/fwn9_p9m_c2_accountant_r5.py
          node tools/fwn9_p9m_c_order_test.cjs --emit-json | sed -n 's/^P9MC1_EVIDENCE=//p' > /tmp/p9mc1.jsonl
          python tools/fwn9_p9m_c_accountant.py < /tmp/p9mc1.jsonl
          node tools/fwn9_p9m_c2_event_test_r3.cjs --emit-proof | sed -n 's/^P9MC2_AUDIT=//p' > /tmp/p9mc2.json
          python tools/fwn9_p9m_c2_accountant_r5.py /tmp/p9mc2.json
      - name: SHA256 of emitted evidence and benchmark
        run: |
          node tools/fwn9_p9m_c3_test.cjs --emit-proof | sed -n 's/^P9MC3_EVIDENCE=//p' > /tmp/p9mc3.json
          test -s /tmp/p9mc3.json
          python -m json.tool /tmp/p9mc3.json > /dev/null
          sha256sum /tmp/p9mc3.json
          node tools/fwn9_p9m_c3_test.cjs --bench
