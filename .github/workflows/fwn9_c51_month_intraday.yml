name: C51 month SIP 5m deterministic cohort read-only replay
on:
  push:
    branches: [research/m11-c51-monthly-intraday-cohort]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  month-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static
        run: |
          python -m pip install --disable-pip-version-check ruff==0.17.3
          python -m py_compile research/raptor51/month_replay.py
          ruff check --select E4,E7,E9,F research/raptor51/month_replay.py
      - name: C51 historical cohort replay
        run: python research/raptor51/month_replay.py
      - name: Guard evidence
        run: |
          python - <<'PY'
          import json,pathlib
          x=json.loads(pathlib.Path('research/raptor51/C51_MONTH_INTRADAY_EXPLORATORY_REPORT.json').read_text())
          assert x['N9S']==x['N10']=='NO_GO'
          assert x['paper_orders']==x['live_orders']==x['broker_fills']==0
          assert x['ORIGINAL']['status']=='UNAVAILABLE_NOT_FABRICATED'
          assert x['source_instrument_count']==40
          assert not x['economic_alpha_validated']
          print('C51_COHORT_NO_OOS_NO_REAL_FILLS_NO_GO')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: C51-MONTH-SIP-5MIN-EXPLORATORY-NO-GO
          retention-days: 30
          path: |
            research/raptor51/PREREGISTERED_COHORT.json
            research/raptor51/C51_MONTH_INTRADAY_EXPLORATORY_REPORT.json
            research/raptor51/month_replay.py
