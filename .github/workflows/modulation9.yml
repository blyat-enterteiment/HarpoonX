name: Synthetic modulation research checks
on:
  push:
    branches: [codex/synthetic-modulation9]
    paths:
      - quant/harpoon_quant/modulation9.py
      - quant/tests/test_modulation9*.py
      - tools/*modulation9*
      - runtime30/modulation9_exit.cjs
      - runtime30/profit8_replay.js
      - .github/workflows/modulation9.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deterministic-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned research checks
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 ruff==0.17.3 mypy==2.4.1
      - name: Static checks
        run: |
          python -m compileall -q quant/harpoon_quant/modulation9.py tools/run_modulation9.py tools/analyze_modulation9.py
          ruff check quant/harpoon_quant/modulation9.py tools/run_modulation9.py tools/analyze_modulation9.py quant/tests/test_modulation9*.py --output-format concise
          MYPYPATH=quant:tools mypy --follow-imports=silent --ignore-missing-imports quant/harpoon_quant/modulation9.py tools/run_modulation9.py tools/analyze_modulation9.py
      - name: Causal, statistical and native regression checks
        env:
          PYTHONPATH: quant:tools
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python -m unittest discover -s quant/tests -p 'test_modulation9*.py' -v
          node --test tools/modulation9_test.cjs
          node --test tools/profit8_replay_test.cjs
      - name: Confirm synthetic-only registration
        run: |
          PYTHONPATH=quant:tools python -c 'from run_modulation9 import verify_registration; r=verify_registration(); print(r["protocol_sha256"])'
