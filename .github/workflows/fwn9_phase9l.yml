name: FWN9 P9L source native replay and durable observation checkpoint
on:
  push:
    branches: [codex/continuous-n9-research]
    paths:
      - runtime30/fwn9_p9l_native_bridge.cjs
      - tools/fwn9_p9l_native_bridge_test.cjs
      - tools/fwn9_p9l_checkpoint.cjs
      - tools/fwn9_p9l_accountant.py
      - research/modulation11/fwn9_phase9l_protocol.json
      - .github/workflows/fwn9_phase9l.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-event-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax and source-native replay with real code paths
        run: |
          node --check runtime30/fwn9_p9l_native_bridge.cjs
          node --check tools/fwn9_p9l_checkpoint.cjs
          node --check tools/fwn9_p9l_native_bridge_test.cjs
          python -m py_compile tools/fwn9_p9l_accountant.py
          node --test tools/fwn9_p9l_native_bridge_test.cjs
      - name: Independent source cash, receipt chronology and reproducibility
        run: |
          node tools/fwn9_p9l_native_bridge_test.cjs --emit-audit > /tmp/native_audit1.txt
          node tools/fwn9_p9l_native_bridge_test.cjs --emit-audit > /tmp/native_audit2.txt
          cmp /tmp/native_audit1.txt /tmp/native_audit2.txt
          python -B tools/fwn9_p9l_accountant.py /tmp/native_audit1.txt
      - name: Source audit Python static and strict typing
        run: |
          python -m pip install --disable-pip-version-check 'ruff==0.14.4' 'mypy==1.18.2'
          ruff check --select E4,E7,E9,F tools/fwn9_p9l_accountant.py
          mypy --strict tools/fwn9_p9l_accountant.py
      - name: Verify preregistered source blobs, frozen M9 and budget
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,subprocess
          root=pathlib.Path('.')
          p=json.loads((root/'research/modulation11/fwn9_phase9l_protocol.json').read_text())
          assert p['budget']=={'economic_accounts':0,'new_candidates':0,'controls_rerun':0,'workers':1,'alpha_spent':0,'m10_final_unopened':3200}
          for name,sha in p['git_blobs'].items():
              actual=subprocess.check_output(['git','hash-object',name],text=True).strip()
              assert actual==sha,(name,actual,sha)
              print('P9L_SHA256',name,hashlib.sha256((root/name).read_bytes()).hexdigest())
          m9=json.loads((root/'research/modulation9/registration.json').read_text())
          for name,sha in m9['sources_sha256'].items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==sha,name
          print('P9L_47_M9_FILES_FROZEN')
          PY
