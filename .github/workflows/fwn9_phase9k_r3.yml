name: FWN9 P9K R3 normalized multicell and independent accountant
on:
  push:
    branches: [codex/continuous-n9-research]
    paths:
      - runtime30/fwn9_p9k_fault_matrix_r2.cjs
      - tools/fwn9_p9k_fault_matrix_test_r2.cjs
      - research/modulation11/fwn9_phase9k_r3_protocol.json
      - .github/workflows/fwn9_phase9k_r3.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reconciled-operational-layers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Node syntax and 27 adversarial shared-cash fault tests
        run: |
          node --check runtime30/fwn9_p9k_fault_matrix_r2.cjs
          node --check tools/fwn9_p9k_fault_matrix_test_r2.cjs
          node --test tools/fwn9_p9k_fault_matrix_test_r2.cjs
      - name: Independent Decimal-60 physical cash and reserve reconciliation
        run: |
          node tools/fwn9_p9k_fault_matrix_test_r2.cjs --emit-audit > /tmp/p9k_r2_audit.txt
          python -B tools/fwn9_p9k_accountant_r3.py /tmp/p9k_r2_audit.txt
      - name: Python syntax, static quality and strict types
        run: |
          python -m pip install --disable-pip-version-check 'ruff==0.14.4' 'mypy==1.18.2'
          python -m py_compile tools/fwn9_p9k_accountant_r3.py
          ruff check --select E4,E7,E9,F tools/fwn9_p9k_accountant_r3.py
          mypy --strict tools/fwn9_p9k_accountant_r3.py
      - name: Frozen 47 M9 source hashes and preregistered Git blobs
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,subprocess
          root=pathlib.Path('.')
          p=json.loads((root/'research/modulation11/fwn9_phase9k_r3_protocol.json').read_text())
          assert p['budget']=={'economic_accounts':0,'new_candidates':0,'controls_rerun':0,'workers':1,'alpha_spent':0,'m10_final_unopened':3200}
          for f,sha in p['code_git_blob_sha1'].items():
              actual=subprocess.check_output(['git','hash-object',f],text=True).strip()
              assert actual==sha,(f,actual,sha)
              print('P9K_R3_SHA256',f,hashlib.sha256((root/f).read_bytes()).hexdigest())
          reg=json.loads((root/'research/modulation9/registration.json').read_text())
          for f,sha in reg['sources_sha256'].items():
              assert hashlib.sha256((root/f).read_bytes()).hexdigest()==sha,f
          print('P9K_R3_M9_47_SOURCE_HASHES_PASS')
          PY
      - name: Benchmark 80 complete fault cycles
        run: |
          node tools/fwn9_p9k_fault_matrix_test_r2.cjs --bench > /tmp/p9k_r2_bench.log
          grep 'P9K_80_FULL_FAULT_CYCLES_MS=' /tmp/p9k_r2_bench.log
