name: N10-P4 European option tail bounds (offline)
on:
  push:
    branches: [codex/n10-p4-european-tail-bounds]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned static/type tools
        run: python -m pip install ruff==0.11.10 mypy==1.15.0
      - name: Compile
        run: python -m compileall -q quant/harpoon_quant/n10_vertical_bounds.py tests/test_n10_vertical_bounds.py tools/n10_p4_verify.py
      - name: Critical static analysis
        run: ruff check --select E4,E7,E9,F63,F7,F82 quant/harpoon_quant/n10_vertical_bounds.py tests/test_n10_vertical_bounds.py tools/n10_p4_verify.py
      - name: Strict type analysis
        run: mypy --strict --follow-imports=silent quant/harpoon_quant/n10_vertical_bounds.py
      - name: Unit tests
        run: PYTHONPATH=. python -m unittest discover -s tests -p test_n10_vertical_bounds.py -v
      - name: SHA-256 independent accountant and microbenchmark
        run: PYTHONPATH=. python tools/n10_p4_verify.py
