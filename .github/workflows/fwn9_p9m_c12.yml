name: FWN9 M11 C12 deterministic WEAK range proof
on:
  push:
    branches: ["codex/continuous-n9-research"]
    paths:
      - "tools/fwn9_p9m_c12_range_vacuity.py"
      - "tools/test_fwn9_p9m_c12_range_vacuity.py"
      - "research/modulation11/fwn9_phase9m_c12_protocol.json"
      - ".github/workflows/fwn9_p9m_c12.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  structural-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.14.10 mypy==1.19.1
      - run: python -m compileall -q tools/fwn9_p9m_c12_range_vacuity.py tools/test_fwn9_p9m_c12_range_vacuity.py
      - run: ruff check tools/fwn9_p9m_c12_range_vacuity.py tools/test_fwn9_p9m_c12_range_vacuity.py
      - run: mypy --strict --follow-imports=skip tools/fwn9_p9m_c12_range_vacuity.py
      - run: PYTHONPATH=tools python -m unittest -v tools/test_fwn9_p9m_c12_range_vacuity.py
      - run: python tools/fwn9_p9m_c12_range_vacuity.py --root .
