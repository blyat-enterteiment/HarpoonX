name: Profitability accounting diagnostics
on:
  push:
    paths:
      - 'tools/profitability_forensics.py'
      - 'tools/test_profitability_forensics.py'
      - 'evidence/residual_30_18_0/run_completed/**'
      - '.github/workflows/profitability-forensics.yml'
  pull_request:
    paths:
      - 'tools/profitability_forensics.py'
      - 'tools/test_profitability_forensics.py'
      - 'evidence/residual_30_18_0/run_completed/**'
      - '.github/workflows/profitability-forensics.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Accounting and tamper regressions
        run: python3 -B -m unittest discover -s tools -p test_profitability_forensics.py
      - name: Reconcile all eight modeled accounts
        run: >-
          python3 -B tools/profitability_forensics.py
          --reports-dir evidence/residual_30_18_0/run_completed
          --output "$RUNNER_TEMP/forensics.json"
      - uses: actions/upload-artifact@v4
        with:
          name: modeled-profitability-forensics
          path: ${{ runner.temp }}/forensics.json
