name: FWN9 C26 causal predecision L1 quotes and broker receipt matching (NO_GO)
on:
  push:
    branches: [research/m11-c26-causal-quote-fill-attainability]
    paths:
      - 'research/modulation11/fwn9_phase9m_c26_protocol.json'
      - 'runtime30/fwn9_c26_causal_quote_fill_bridge.cjs'
      - 'tools/fwn9_c26_causal_quote_fill_bridge_test.cjs'
      - 'tools/fwn9_c26_readonly_cli.cjs'
      - 'docs/MODULATION11_PHASE9M_C26.md'
      - 'evidence/modulation11/fwn9_phase9m_c26_evidence.json'
      - '.github/workflows/fwn9_p9m_c26.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  causal-market-pricing-evidence-no-financial-promotion:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source syntax and absence of broker scripts' execution
        run: |
          node --check runtime30/fwn9_c26_causal_quote_fill_bridge.cjs
          node --check tools/fwn9_c26_causal_quote_fill_bridge_test.cjs
          node --check tools/fwn9_c26_readonly_cli.cjs
      - name: C26 24 synthetic engineering causal quote, fill and offline CLI checks
        run: node --test tools/fwn9_c26_causal_quote_fill_bridge_test.cjs
      - name: C25 source-native activity and GET-only private export regression
        run: |
          node --test tools/fwn9_c25_broker_export_ingest_test.cjs
          node --test tools/fwn9_c25_alpaca_readonly_exporter_test.cjs
      - name: C24-C16 original source safety, portfolio and receipts regression
        run: |
          node --test tools/fwn9_p9m_c24_evidence_closure_test.cjs
          node --test tools/fwn9_p9m_c23_market_data_audit_test.cjs
          node --test tools/fwn9_c22_session_compound_test.cjs
          node --test tools/fwn9_p9m_c21_ohlc_obstruction_test.cjs
          node --test tools/fwn9_p9m_c20_native_admission_test.cjs
          node --test tools/fwn9_p9m_c16_native_au_test.cjs
      - name: C17-C21 Gaussian, expected admission and prefix-price math regressions
        env:
          PYTHONPATH: tools
        run: |
          python -m pip install --disable-pip-version-check numpy==2.2.6 scipy==1.14.1
          python -B -m unittest discover -s tools -p 'test_fwn9_p9m_c21_archived_prebar_audit.py' -q
          python -B -m unittest discover -s tools -p 'test_fwn9_p9m_c20_triggered_u_admission_a.py' -q
          python -B -m unittest discover -s tools -p 'test_fwn9_p9m_c19_native_credit_moment.py' -q
          python -B -m unittest discover -s tools -p 'test_fwn9_p9m_c18_funded_wealth_dual.py' -q
          python -B -m unittest discover -s tools -p 'test_fwn9_p9m_c17_weak_population.py' -q
      - name: Independent Decimal46 accounting, original C15 no certification
        run: |
          node tools/fwn9_p9m_c16_native_au_test.cjs --emit-c16 > /tmp/c26_c16.log
          python -B tools/fwn9_p9m_c16_decimal_accountant.py /tmp/c26_c16.log
          python -B tools/fwn9_p9m_c16_c15_handoff.py /tmp/c26_c16.log research/modulation9/protocol.json > /tmp/c26_gate.log
          python - <<'PY'
          from pathlib import Path
          import json
          o=json.loads(Path('/tmp/c26_gate.log').read_text().split('FWN9_C16_C15_HANDOFF=',1)[1])
          assert o['N9SAdmission']=='NO_GO'
          for scenario in ('NOMINAL','STRESS'):
              assert o['population_C15_screens'][scenario]['expected_A_upper'] is None
              assert o['population_C15_screens'][scenario]['expected_U_upper'] is None
          print('C26_ORIGINAL_C15_NO_NATIVE_POPULATION_GO')
          PY
      - name: Original source immutable and M10 holdout sealed
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          r=json.loads(Path('research/modulation9/registration.json').read_text())
          for p in ('quant/harpoon_quant/modulation9.py','runtime30/profit8_replay.js','runtime30/ultimate_reservations.js','research/modulation9/protocol.json'):
              assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==r['sources_sha256'][p]
          p=json.loads(Path('research/modulation11/fwn9_phase9m_c26_protocol.json').read_text())
          assert p['budget']=={'new_signals':0,'new_market_seeds':0,'new_economic_accounts':0,'new_broker_GET_in_CI':0,'new_broker_orders':0,'opened_M10_final':0,'remaining_M10_final':3200,'deploy':False,'merge':False,'optimizer_restarted':False}
          assert p['decision']['N9S']=='NO_GO'
          assert not list(Path('evidence').rglob('final/*.json.gz'))
          print('C26_N9S_NO_GO_SOURCE_M10_HOLDOUT_LOCK_PASS')
          PY
