name: C47 SIP fixed-rule 5Min Raptor net from posthoc 16 tickers
on:
  push:
    branches: [research/m11-c47-raptor-sip-fishing-net]
  pull_request:
    branches: [research/m11-c46-raptor-breakout-5min]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sip-replication:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static and source contracts
        run: |
          python -m pip install --disable-pip-version-check ruff==0.17.3 mypy==2.4.1
          python -m py_compile research/raptor47/replay_sip.py research/raptor47/test_replay_sip.py
          ruff check --select E4,E7,E9,F research/raptor47/replay_sip.py research/raptor47/test_replay_sip.py
          mypy --follow-imports=silent --ignore-missing-imports research/raptor47/replay_sip.py
      - name: Existing C46 immutable 3/4percent local runner regressions
        run: python -m unittest discover -s research/raptor46 -p test_raptor.py -v
      - name: C47 actual SIP RTH and source tamper regression
        run: PYTHONPATH=research/raptor46 python -m unittest discover -s research/raptor47 -p test_replay_sip.py -v
      - name: Emit fixed cost shock comparison
        run: PYTHONPATH=research/raptor46 python research/raptor47/replay_sip.py
      - name: Prohibit false real broker fills and N9 promotion
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('research/raptor47/artifacts')
          a=json.loads((p/'C47_SIP_RAPTOR_UNTUNED_FINANCIAL_MODEL.json').read_text())
          r=json.loads((p/'C47_SIP_RAPTOR_ECONOMIC_SUMMARY.json').read_text())
          assert a['source']['raw_returned_5min_bars']==2540
          assert a['source_feed']=='SIP' and a['regular_session_only']
          assert a['source']['broker_order_fills_verified'] is False
          assert a['post_selection_bias_disqualifies_prospective_inference']
          assert a['no_72_hour_swing_results_from_1_day_bars']
          assert a['N9S']=='NO_GO' and a['N10']=='NO_GO'
          assert a['orders_PAPER']==0 and a['orders_LIVE']==0
          assert r['real_fills']==0
          print('C47_2540_REAL_SIP_RTH_3_4PCT_RUNNER_NO_ORDERS_N9_NO_GO')
          PY
      - name: Preserve immutable legacy trading source provenance
        run: python tools/fwn9_p9i_provenance.py > /tmp/C47_legacy.txt
      - uses: actions/upload-artifact@v4
        with:
          name: C47-RAPTOR-2540-SIP-RTH-SWING-NOT-PROVEN
          retention-days: 30
          if-no-files-found: error
          path: |
            research/raptor47/FROZEN_BEFORE_FULL_SIP_DATA.json
            research/raptor47/SIP_FIVE_MIN_2026_11_12_13_16_VISIBLE.csv
            research/raptor47/source_manifest.json
            research/raptor47/replay_sip.py
            research/raptor47/test_replay_sip.py
            research/raptor47/artifacts/*
            research/raptor46/local_fishing_net.py
            research/raptor46/replay_net.py
            research/raptor46/assess_breakout.py
