name: FWN9 C32 native prefilter source and lineage
on:
  push:
    branches:
      - research/m11-c32-native-prefilter-source-provenance
  pull_request:
    branches:
      - research/m11-c31-native-lineage-witness
  workflow_dispatch:
permissions:
  contents: read
jobs:
  c32-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies without scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Strict native TypeScript source typecheck
        run: npm run typecheck:xxx
      - name: Build native JavaScript from typed source
        run: npm run build:xxx
      - name: Syntax source and witnesses
        run: |
          node --check runtime30/plugins.js
          node --check runtime30/fwn9_c32_native_prefilter_gate.cjs
          node --check runtime30/fwn9_c32_prefilter_journal.cjs
          node --check tools/fwn9_c32_native_prefilter_test.cjs
      - name: C32 native and C31 C30 regressions
        run: node --test tools/fwn9_c32_native_prefilter_test.cjs tools/fwn9_c31_native_lineage_witness_test.cjs tools/fwn9_c30_study_feasibility_test.cjs
