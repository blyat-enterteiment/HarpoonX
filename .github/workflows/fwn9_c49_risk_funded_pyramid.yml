name: C49 research-only funded Raptor pyramid
on:
  push:
    branches: [research/m11-c49-risk-funded-pyramid]
  pull_request:
    branches: [research/m11-c48-raptor-causal-funnel]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-order-risk-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Type and static checks
        run: |
          python -m pip install --disable-pip-version-check ruff==0.17.3 mypy==2.4.1
          python -m py_compile research/raptor49/*.py
          ruff check --select E4,E7,E9,F research/raptor49
          mypy --strict research/raptor49/risk_funded_pyramid.py
      - name: Adversarial risk unit tests
        run: PYTHONPATH=research/raptor49 python -m unittest discover -s research/raptor49 -p test_risk_funded_pyramid.py -v
      - name: Frozen C48 and C47 regression
        run: |
          PYTHONPATH=research/raptor46:research/raptor47:research/raptor48 python -m unittest discover -s research/raptor48 -p test_causal_funnel.py -v
          PYTHONPATH=research/raptor46 python -m unittest discover -s research/raptor47 -p test_replay_sip.py -v
      - name: Historical source provenance
        run: python tools/fwn9_p9i_provenance.py
