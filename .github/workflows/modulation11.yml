name: M11 exact-law execution fixture checks
on:
  push:
    branches: [codex/continuous-n9-research]
    paths:
      - quant/harpoon_quant/modulation11_substeps.py
      - quant/tests/test_modulation11_substeps.py
      - runtime30/modulation11_execution_equivalence.cjs
      - tools/modulation11_fixture_test.cjs
      - research/modulation11/**
      - .github/workflows/modulation11.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  phase0-equivalence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frozen research check tools
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 ruff==0.17.3 mypy==2.4.1
      - name: Syntax static typing and lint
        run: |
          python -m compileall -q quant/harpoon_quant/modulation11_substeps.py quant/tests/test_modulation11_substeps.py
          ruff check quant/harpoon_quant/modulation11_substeps.py quant/tests/test_modulation11_substeps.py
          MYPYPATH=quant mypy --follow-imports=silent --ignore-missing-imports quant/harpoon_quant/modulation11_substeps.py
          node --check runtime30/modulation11_execution_equivalence.cjs
          node --check tools/modulation11_fixture_test.cjs
      - name: Execute isolated non-economic fixtures with source identities
        env:
          PYTHONPATH: quant:tools
          OPENBLAS_NUM_THREADS: '1'
        run: |
          node --test tools/modulation11_fixture_test.cjs
          python -m unittest discover -s quant/tests -p 'test_modulation11_substeps.py' -v
