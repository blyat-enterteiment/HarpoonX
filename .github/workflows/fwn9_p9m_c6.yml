name: FWN9 P9M-C6 conditional endogenous stop exposure budget
on:
  push:
    branches: [codex/continuous-n9-research]
    paths:
      - tools/fwn9_p9m_c6_budget.py
      - tools/test_fwn9_p9m_c6_budget.py
      - research/modulation11/fwn9_phase9m_c6_protocol.json
      - .github/workflows/fwn9_p9m_c6.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stop-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax, static analysis and strict scoped type check
        run: |
          python -m pip install --disable-pip-version-check ruff==0.14.7 mypy==1.18.2
          ruff check tools/fwn9_p9m_c6_budget.py tools/test_fwn9_p9m_c6_budget.py
          mypy --strict --follow-imports=silent tools/fwn9_p9m_c6_budget.py
          python -m py_compile tools/fwn9_p9m_c6_budget.py tools/test_fwn9_p9m_c6_budget.py
      - name: Adversarial deterministic inventory fixtures
        run: python -B -m unittest discover -s tools -p 'test_fwn9_p9m_c6_budget.py' -v
      - name: Freeze source and budget rules
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, subprocess
          p=json.loads(pathlib.Path('research/modulation11/fwn9_phase9m_c6_protocol.json').read_text())
          assert p['budget']['new_economic_accounts']==0 and p['budget']['final_m10_unopened']==3200
          assert p['budget']['alpha_spent']==0
          for path, expected in p['source_sha256'].items():
              actual=hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()
              assert actual==expected,(path,actual,expected)
          r=json.loads(pathlib.Path('research/modulation9/registration.json').read_text())
          src='quant/harpoon_quant/modulation9.py'
          assert hashlib.sha256(pathlib.Path(src).read_bytes()).hexdigest()==r['sources_sha256'][src]
          print('P9MC6_M9_GENERATOR_AND_NEW_MODULE_HASH_PASS')
          PY
      - name: Deterministic bench and diagnostic (not population inference)
        run: |
          python - <<'PY'
          import sys, time
          sys.path.insert(0,'tools')
          from fwn9_p9m_c6_budget import example
          t=time.perf_counter()
          for _ in range(10000): example()
          print('P9MC6_10000_FIXED_LEDGER_AUDITS_MS',round((time.perf_counter()-t)*1000,3))
          x=example()
          assert not x['population_bound_certified']
          assert not x['expected_log_wealth_bound_certified']
          print('P9MC6_FIXTURE_NOMINAL_UPPER_USD',x['nominal_credit_allowance_usd'])
          PY
