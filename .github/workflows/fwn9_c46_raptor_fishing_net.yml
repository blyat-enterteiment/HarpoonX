name: C46 Raptor actual IEX 5Min breakout + asymmetric runner NO_GO
on:
  push:
    branches: [research/m11-c46-raptor-breakout-5min]
  pull_request:
    branches: [research/m11-c42-n10-upside-frontier]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  raptor-5min:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax and static tests for Raptor
        run: |
          python -m pip install --disable-pip-version-check ruff==0.17.3 mypy==2.4.1
          python -m py_compile research/raptor46/assess_breakout.py research/raptor46/local_fishing_net.py research/raptor46/replay_net.py research/raptor46/test_raptor.py
          ruff check --select E4,E7,E9,F research/raptor46/local_fishing_net.py research/raptor46/replay_net.py research/raptor46/test_raptor.py
          mypy --follow-imports=silent --ignore-missing-imports research/raptor46/local_fishing_net.py research/raptor46/replay_net.py
      - name: 19 price-grid anti-lookahead shared-risk state-machine tests
        run: python -m unittest discover -s research/raptor46 -p test_raptor.py -v
      - name: Reproduce original IEX raw touch screening and 3/4pct runner
        run: |
          python research/raptor46/assess_breakout.py
          python research/raptor46/replay_net.py
      - name: Verify hashes and no fictitious broker fills
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('research/raptor46/artifacts')
          r=json.loads((p/'C46_ASYMMETRIC_FISHING_NET_PORTFOLIO_REPLAY.json').read_text())
          s=json.loads((p/'C46_FISHING_NET_SUMMARY.json').read_text())
          assert r['source']['original_IEX_5_min_bars']==808
          assert len(r['sensitivity'])==2
          assert r['sensitivity']['3']['raw_IEX_high_threshold_touches']==6
          assert r['sensitivity']['4']['raw_IEX_high_threshold_touches']==5
          assert r['paper_orders']==0 and r['live_orders']==0
          assert r['N9S']=='NO_GO' and r['N10']=='NO_GO'
          assert r['selection_lookahead_bias_present'] is True
          assert r['two_day_IEX_observation_not_72_hour_swing_evaluation'] is True
          assert s['actual_fills']==0
          print('C46_808_ACTUAL_IEX_BARS_NEW_GRID_MODELED_ONLY_N9_NO_GO')
          PY
      - name: Guard original M9 immutable sources and C38 stop core
        run: |
          python tools/fwn9_p9i_provenance.py > /tmp/C46_m9_provenance.json
          PYTHONPATH=quant python -m unittest discover -s quant/tests -p 'test_m11_five_level_guard.py'
      - uses: actions/upload-artifact@v4
        with:
          name: C46-RAPTOR-808-REAL-IEX-5MIN-NO-FILLS-NO_GO
          retention-days: 30
          if-no-files-found: error
          path: |
            research/raptor46/POSTHOC_AUDIT_PROTOCOL.json
            research/raptor46/IEX_FIVE_MIN_2026_11_12_13_16_VISIBLE.csv
            research/raptor46/source_manifest.json
            research/raptor46/assess_breakout.py
            research/raptor46/local_fishing_net.py
            research/raptor46/replay_net.py
            research/raptor46/test_raptor.py
            research/raptor46/artifacts/*
