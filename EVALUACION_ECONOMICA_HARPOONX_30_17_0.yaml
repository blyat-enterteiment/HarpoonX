    evidencia: Ninguna candidata supera los gates con corrección familiar de 60 endpoints y sensibilidad de bloques
      de 5 y 20 sesiones
  - id: R7
    exige: Confirmación temporal genuinamente no vista y control global de ensayos
    estado: NO_CUMPLIDO
    evidencia: TEST reutilizado; total histórico global desconocido
  - id: R8
    exige: Validación prospectiva observada y reconciliación operacional en alcance autorizado
    estado: NO_EJECUTADO
    evidencia: No broker/deploy/credenciales. Requiere datos/autorización y ventana futura real
  conclusion: NO_ACREDITADO
cambios_core:
- archivo: xxx/ultimate_replay.ts
  problema: PeakEquity se observaba sólo en tiempos de señales admitidas, pudiendo ignorar máximos entre decisiones.
  solucion: Cola causal de entradas, marks, costes de sesión y derechos; HWM avanza únicamente hasta la decisión.
  pruebas: 4 fixtures de regresión; no confundirlos con precios históricos observados.
- archivo: quant/harpoon_quant/historical_bank.py
  problema: Features ignoraban splits presentes en señales.
  solucion: Ajuste de precio/VWAP/volumen as-of para símbolo y benchmark; eventos futuros no entran y publicación
    explícita futura se rechaza.
  pruebas: 6 fixtures; base histórica actual no contiene splits.
- archivo: tools/quant8_register.py
  solucion: Familia única 12 slots, bindings completos de fuente/artefactos y fuente 29/128 inmutable; recuperación
    atómica.
- archivo: tools/quant 8_replay.cjs + tools/quant 8_verify.py
  solucion: CLI exige reserva y rederiva señales/labels/features/modelos/admisiones antes del replay; tamper falla
    cerrado.
- archivo: tools/run_quant8.py
  solucion: Auditoría deriva caps esperados del protocolo; no acepta límites declarados por el mismo reporte.
matematica_implementada:
  admisibilidad: mu_nominal_neta(x) −2*SE_media_aprox(x) −Delta_friccion_estres(precio_conocido) >0,0005
  mu: Ridgeλ1 y Huberα1 ε1,35; ochofeatures, normalización median/IQR con std fallback, target estandarizado; ajustes
    fijos por activo.
  incertidumbre: Sandwich agrupado por sesión de coeficientes; incertidumbre de media condicional, NO volatilidad
    predictiva. Sesiones dependientes, sesgo de regularización y escala Huber estimada no totalmente cubiertos;2×SE
    no garantiza 95%.
  costes: Target incluye fricción nominal modelada y dividendos. Delta de estrés sólo diferencia de spread+slippage+comisión
    roundtrip. Gastos externos una vez en la cuenta y en CASH, no otra vez en el hurdle.
  regimen: Umbral rv 12 percentil 80 calculado únicamente en train; rechaza 29/356 decisiones. Huber+régimen reduce
    a 0,5 los caps de riesgo/gross/asset/openrisk.
  covarianza: No se implementó un asignador covariance-optimal. Cuatro exposiciones de equity/ETF no constituyen
    diversificación independiente; el cap conservador no es una estimación de alpha.
  recetas:
    ridge_lambda: 1.0
    huber_alpha: 1.0
    huber_epsilon: 1.35
    huber_max_iter: 2000
    mean_uncertainty_multiplier: 2.0
    minimum_net_return_bps: 5.0
    maximum_absolute_training_z: 8.0
    regime_rv_quantile: 0.8
    minimum_training_rows: 40
    minimum_training_sessions: 30
    feature_scaling: MEDIAN_IQR_STD_FALLBACK
    target_scaling: MEAN_STD
    external_cost_hurdle_return: 0.0
  recalibracion_walk_forward: false
  busqueda_hiperparametros: 0
