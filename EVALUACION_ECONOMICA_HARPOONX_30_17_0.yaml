  - id: R2
    exige: Causalidad temporal, labels purgados, splits y referencias as-of
    estado: SOFTWARE_CORREGIDO; PROVENIENCIA_CONDICIONAL
    evidencia: 10 regresiones nuevas de HWM/splits; fechas corporativas no certificadas
  - id: R3
    exige: Capital continuo, caja, reservas, costes y derechos conciliados
    estado: CUMPLIDO_EN_MODELO_NO_CUENTA_REAL
    evidencia: 14 curvas auditadas,20.000 USD sin reset entre fases
  - id: R4
    exige: Límites ex ante y estrés sin elevar riesgo
    estado: CUMPLIDO_EN_MODELO; RIESGO_REAL_NO_CERTIFICADO
    evidencia: IOC, HWM causal, caps reducidos o intactos; dailygate es close-to-close, no garantía intradía
  - id: R5
    exige: Datos corporativos completos y costes/ejecución observados verificables
    estado: BLOQUEADO
    evidencia: Faltan facturas, profundidad, fills/latencia e integridad/publicación corporativa completa
  - id: R6
    exige: Crecimiento neto positivo y ventaja pareada sobreCASH/C 0/Ridge bajo nominal y estrés
