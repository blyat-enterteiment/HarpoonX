resumen_ejecutivo:
- 'Ridge con hurdle: −299,60 USD nominal,3 campañas; −578,35 USD estrés,1 campaña. No alcanza crecimiento neto positivo.'
- Huber y Huber+régimen:0 campañas; empatanCASH después de costes:−294 USD nominal/−588 USD estrés. Abstenerse evita
  riesgo innecesario, no crea rentabilidad.
- La mejora nominal frente al Ridge anterior es 67,28 USD en esta muestra vista; no es estimación garantizada de
  mejora futura.
- Los dos defectos causales se corrigieron, pero no cambiaron las seis curvas de control en esta base; su existencia
  se demuestra con regresiones sintéticas.
- La familia quedó cerrada sin bajar umbrales, buscar nuevos parámetros ni aumentar exposición después de ver resultados.
