incertidumbre_y_limitaciones:
  intervalo_de_rentabilidad: null
  limites:
  - Modelos Ridge anteriores no adquieren purga causal retroactiva; se conservan originales y su procedencia. Aplicar
    el ajuste corregido requiere nuevos artefactos de entrenamiento admisible y evaluación temporal nueva cuando
    corresponda.
  - Los metadatos son recibos locales del cálculo, no autenticación externa independiente de disponibilidad de etiquetas.
  - Cambiar core.py o calibration.py invalida por diseño implementation_hash de modelos SVR sellados con otra implementación;
    nunca cambiar sus hashes para forzar aceptación. Solo fixtures sintéticos explícitos pueden regenerarse como
    pruebas.
  - No se realizaron nuevos ensayos financieros, ni se elevaron límites o calificación económica; los ajustes de
    prueba usan exclusivamente datos sintéticos.
  - El asignador conserva ejecución modelada agresiva a ask. Una sugerencia entry inferior no implementa prioridad
    de cola ni una ejecución pasiva realizable.
  - All broker events are synthetic in-memory fixtures; no market/account or real latency evidence.
  - Cancel request does not establish cancellation; syncAt invalidated and ownership must be reconciled.
  - No outside-session sales/protection order activation, risk expansion, model promotion, deployment or external
    order.
  - Initial process-isolated runner returned generic test-process failure; non-isolated runner executed every test
    with explicit counts.
  - Initial full-reconcile fixture shared a nested object and did not inject stale status; corrected fixture and
    both historical outputs retained.
  - Los agentes comparten entorno y contexto. Su revisión no es auditoría externa independiente.
  - No se construyó una imagen Docker ni se desplegó la aplicación. Las pruebas de distribución validan archivos
    y ejecución local.
  - La gestión que requiere persistencia sigue necesitando persistencia disponible.
  - El benchmark es descriptivo con 15 asignaciones por versión; no demuestra aceleración estadística, latencia
    de producción ni rentabilidad.
