  mecanismos_identificados: &id001
  - id: CORE5-Q1
    classification: HECHO_SOBRE_CONTRAEJEMPLO_SINTETICO
    function: calibration.fit
    before: Etiquetas publicadas el 11-abril podían entrar en selección iniciada el 14-marzo y evaluación iniciada
      el 7-abril.
    after: Purga estricta por fin de etiqueta y disponibilidad antes de cada frontera; recibos de esas fronteras
      en ajustes nuevos.
    evidence: review/quant/before.json; review/quant/after.json; quant/tests/test_core5_numeric.py
  - id: CORE5-Q2
    classification: HECHO_SOBRE_CONTRAEJEMPLO_SINTETICO
    function: core.instrument
    before:
      cash_available_usd: 250
      quantity: 49
      reserved_usd: 49.049
      modeled_cash_need_usd: 4907.35245
    after:
      quantity: 2
      reserved_usd: 200.3001
      modeled_cash_need_usd: 200.3001
    evidence: review/quant/before.json; review/quant/after.json
  - id: CORE5-BRIDGE
    classification: HECHO_SOBRE_CONTRAEJEMPLO_SINTETICO
    function: bridge.runtime_config/from_runtime
    before: La configuración general sobrescribía cotas más restrictivas del core, incluso ocultando valores inválidos.
    after: Ambas capas se validan antes de intersectar; cotas explícitas mínimas, slippage máximo, edad de cotización
      coherente en segundos/milisegundos.
    evidence: review/adversary/bridge_limits_before.json; review/adversary/bridge_limits_after.json; quant/tests/test_core5_bridge_limits.py
  - id: CORE5-RUNTIME-01
    classification: HECHO_SOBRE_BROKER_SINTETICO
    function: Coordinator.adoptLegs
    before: Respuesta anidada atrasada podía reactivar una pata OCO terminal con la misma cantidad ejecutada.
    after: Conserva terminalidad cuando el acumulado no cambia; acepta aumentos reales para conciliarlos.
    evidence: review/runtime/baseline_full13.log; review/full_validation/core5_runtime_test.log
  - id: CORE5-RUNTIME-02
    classification: HECHO_SOBRE_BROKER_SINTETICO
    function: Coordinator.manage
    before: MARKET_CLOSED impedía cancelar el remanente de una entrada parcialmente ejecutada.
    after: Permite la rama acotada de cancelación con propiedad y conciliación verificadas; la solicitud no confirma
      cancelación ni crea ventas fuera de sesión.
    evidence: review/runtime/baseline_full13.log; review/full_validation/core5_runtime_test.log
