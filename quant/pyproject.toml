[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "harpoon-quant"
version = "1.8.1"
description = "Scenario-based multiasset research and allocation engine for HarpoonX"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "scipy>=1.14,<2", "scikit-learn>=1.8,<2"]

[tool.setuptools.packages.find]
include = ["harpoon_quant*"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF"]

[tool.mypy]
ignore_missing_imports = true
