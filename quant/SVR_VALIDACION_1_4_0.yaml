dictamen:
  software: IMPLEMENTADO_VERIFICADO
  economico: VENTAJA_NO_DEMOSTRADA
  clasificacion: HECHO
  fecha: *fecha
  fundamento: >-
    El nuevo estimador se calibra, exporta e integra en la asignación en sombra.
    Las pruebas finales de software pasan. No se ha medido PnL de SVR con mercado
    observado, PAPER o cuenta real; accepted no constituye aprobación económica.
  evidencia:
    - evidence/svr/python_full_suite.log
    - evidence/svr/node_quant_legacy_final.log
    - evidence/svr/node_svr_final.log
    - evidence/svr/typescript_operations_validation.json
    - examples/svr/receipt.synthetic.json
  ordenes_enviadas: 0
  despliegues_modificados: 0
  siguiente_etapa_economica: null
  causa: "Faltan panel observado admisible, protocolo financiero nuevo y evaluación prospectiva autorizada."

implementacion:
  clasificacion: HECHO
  fecha: *fecha
  hipotesis: {clase: HIPOTESIS, enunciado: "Una relación no lineal podría mejorar el pronóstico del retorno."}
  funciones:
    - {ruta: harpoon_quant/calibration.py, funcion: "fit(..., estimator='ridge'|'svr')"}
    - {ruta: harpoon_quant/scalar_svr.py, funcion: "fit_scalar_svr(data, available_at, cfg)"}
    - {ruta: harpoon_quant/scalar_svr.py, funcion: "predict_scalar(cal, underlying, x, when, cfg) -> float"}
    - {ruta: harpoon_quant/core.py, funcion: "predict y allocate despachan por tipo de artefacto"}
    - {ruta: harpoon_quant/__main__.py, funcion: "--estimator ridge|svr únicamente para fit"}
    - {ruta: runtime/quant_bridge.cjs, funcion: "Discovery bloqueado para artefactos SVR de investigación"}
  compatibilidad:
    ridge_predeterminado: true
    artefactos_ridge_anteriores: conservados
    svr_de_costes_en_support_py: conservado
    diferencia: "El SVR existente estima coste adicional en puntos base; el nuevo estima retorno simple."
    nuevos_servicios_o_llamadas_LLM: 0
    arquitectura: "Se mantiene el worker Python y el asignador con restricciones compartidas."
  evidencia: [harpoon_quant/scalar_svr.py, tests/test_scalar_svr.py, README_ES.md]

variables_y_unidades:
  clasificacion: HECHO
  fuente: "harpoon_quant/core.py: FEATURES y features"
  orden_inmutable:
    - {variable: momentum_1, definicion: "log(cierre_t/cierre_t-1)", unidad: adimensional}
    - {variable: momentum_3, definicion: "log(cierre_t/cierre_t-3)", unidad: adimensional}
    - {variable: momentum_12, definicion: "log(cierre_t/cierre_t-12)", unidad: adimensional}
    - {variable: rv_12, definicion: "Raíz de la media de cuadrados de 12 retornos logarítmicos contiguos", unidad: adimensional}
    - {variable: log_rvol, definicion: "log(1 + volumen_relativo)", unidad: adimensional}
    - {variable: vwap_z, definicion: "log(ask/VWAP) / rv_12", unidad: adimensional}
    - {variable: relative_3, definicion: "momentum_3 menos retorno logarítmico alineado del benchmark", unidad: adimensional}
    - {variable: spread_fraction, definicion: "(ask-bid)/ask", unidad: fraccion}
  objetivo: {nombre: target_return, unidad: return_fraction, significado: "0.01 equivale a 1 %"}
  horizonte_fixture_horas: 24
  dominio_objetivo: "Retorno simple finito mayor o igual que -1; se conservan valores negativos."
  separacion: "Las características pueden ser logarítmicas; el objetivo y la predicción son retornos simples."
  costes: "La predicción no es PnL neto; el asignador conserva precios, comisiones y fricciones existentes."
  nota_fixture: "Sus ocho números se generan artificialmente; no se reconstruyen cotizaciones de mercado."

metodo_calibracion:
  clasificacion: HECHO
  fecha: *fecha
  evidencia: [harpoon_quant/scalar_svr.py, harpoon_quant/calibration.py, examples/svr/model.synthetic.json]
  estimador: "sklearn.svm.SVR, kernel de función de base radial (RBF)"
  parametros:
    C_candidatos: [0.5, 2.0, 8.0]
    epsilon_objetivo_estandarizado: 0.1
    gamma: 0.125
    tol: 0.0001
    cache_size_MB: 64
    max_iter: 50000
    shrinking: true
    ridge_lambda_candidatos: [0.1, 10.0, 100.0]
  escalado:
    X: "z_j = (x_j - media_j) / max(std_poblacional_j, 1e-6)"
    y: "y_z = (y - media_y) / max(std_poblacional_y, 1e-12)"
    inversion: "prediccion = media_y + escala_y * SVR(z)"
    seleccion: "Medias y escalas se ajustan sólo con train durante selección de C."
    ajuste_final: "Tras seleccionar parámetros, se reajustan sólo con train + validation purgados."
    test: "No ajusta escalas, hiperparámetros ni vectores soporte."
  separacion_temporal:
    proporcion_nominal: [0.60, 0.20, 0.20]
    validacion_desde: "2026-06-14"
    prueba_desde: "2026-08-13"
    purga: "label_end Y label_known_at deben preceder la medianoche UTC de la siguiente partición."
    causalidad: "features_known_at <= at < label_end <= label_known_at < available_at"
    sesiones: "Una fila por activo y sesión UTC; horizonte de etiqueta igual al configurado."
    minimos_por_activo: {train: 40, validation: 10, test: 20}
  controles: [media_historica_train_validation, ridge_seleccionado_en_validation]
  accepted:
    significado: "Ambos límites inferiores de mejora pareada del error cuadrático son positivos."
    metodo: "Bootstrap circular de bloques de 5 sesiones, cuantil 0.05/family_tests."
    familia: "6 configuraciones * 2 comparaciones * número de activos del ajuste."
    replica: "Al menos 2000; aumenta para resolver la cola corregida, con límite computacional."
    limite: "Bloques de 5 sesiones: heurística heredada que debe justificarse con dependencia observada."
    interpretacion: "Habilidad predictiva en la muestra evaluada; no rentabilidad ni permiso de operar."
  presupuesto_computacional:
    configuraciones_maximas_por_activo: 6
    filas_totales_maximas: 5000
    filas_maximas_por_activo: 2000
    activos_maximos: 16
    vectores_soporte_maximos_por_activo: 2000
    inferencia_tamano_lote: 128
    contabilizacion: "Activos rechazados antes del ajuste conservan trials=[]; se cuenta lo ejecutado."
    presupuesto_financiero: "Estas calibraciones sintéticas no reinician ni amplían el historial financiero."

