limitaciones_y_trabajo_pendiente:
  - "No se aporta un panel observado admisible para entrenar este SVR ni PnL económico atribuible a él."
  - "La partición es un único bloque temporal 60/20/20; no constituye walk-forward financiero completo."
  - "El test se usa para accepted predictivo; ya no es un holdout futuro independiente para nuevas decisiones."
  - "La corrección familiar cubre esta calibración; no una búsqueda humana ilimitada entre ejecuciones."
  - "El bootstrap de cinco sesiones y su cobertura requieren validación con dependencia temporal y entre activos real."
  - "El hash verifica consistencia, no autenticidad del origen OBSERVED ni firma de un proveedor."
  - "Costes, fills, liquidez, patrimonio continuo y gastos externos deben validarse con observaciones reconciliadas."
  - "Menor MSE sintético no demuestra retorno neto, alpha, frecuencia HFT ni habilita exposición."
  - "No hay mecanismo de promoción financiera de este SVR a PAPER o LIVE en esta entrega."

