  evidencia_a_favor: Reproducciones exactas, contabilidad interna reconciliada, reducción media de pérdida
    de33.541499USD frente al control histórico.
  evidencia_en_contra: Pérdida media absoluta, crecimiento logarítmico negativo, límite inferior de mejora
    negativo y deterioro con costes/estrés.
  condicion_decisiva: No cumple simultáneamente crecimiento neto positivo y evidencia suficiente; la cuenta
    real no es evaluable con estos accesos.
  mejora_economica_demostrada: false
  candidato_para_forward: false
  datos_decisivos_faltantes:
