  - Extractos de patrimonio, efectivo, posiciones/pasivos, flujos, órdenes, fills, tarifas y gastos externos
    del periodo.
  - Logs sincronizados de mercado/recepción/decisión/envío/fill/cancelación con versiones.
  - Histórico observado de cotizaciones/operaciones, especialmente opcionesOPRA o alternativa autorizada
    y suficiente.
  - Periodo observado no utilizado y criterio económico/estadístico prospectivo con presupuesto compatible.
  estado_de_seguridad: Investigación offline completada hasta los límites de evidencia; modo y exposición
    externos sin cambios.
artefactos_y_reproduccion:
  codigo: Aplicación30.7.1 y motor1.3.1 con snapshots históricos congelados; source_changes.patch en paquete
