    cambio: Comprobar límites con patrimonio proyectado tras ejecución y actualizarlo después de cada
      entrada.
    verificacion: Fixture de tope5%:1000 excedía999.8175; la entrada se descarta tras la corrección.
    limite: Protege admisión en el modelo; costes reales desconocidos.
  - id: CASH_EVENT_LEDGER
    evidencia: harpoon_quant/ledger.py; tests/test_economic_safety.py
    mecanismo: Registro antiguo ENTRY/NAV sin cierres ni identidad independiente de posición.
    cambio: ENTRY/EXIT/PRE_NAV/NAV con posición, importes brutos, fees, efectivo, inventario y tiempos;
