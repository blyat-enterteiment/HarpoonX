    - optionOrderTick
    - optionBudget
    - MassiveOptionData
    - optionResearchView
    difference: Contract identity, OPRA chain completeness, quoted size, expiry/open interest/Greek checks, budget
      before rank and optional bounded external data adapter.
    recommendation: Port only through the common market/types/policy contract with current net ledger and operational
      gates retained. Keep licenses, budgets and permissions unassumed; do not silently switch IEX to paid SIP or
      enable a new provider.
  - feature: Options reviewed net-value boundary and capture
