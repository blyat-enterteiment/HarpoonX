  - A rejected save/lease blocks the mutation that depends on it. This is not retrospective revocation of an already
    acknowledged intent or an in-flight broker request when another operation fails.
  - Existing broker-accepted protection orders remain external state; their coverage and completion require reconciliation,
    not assumption.
  - Full software-managed exit/protection continuity is not promised while durable storage is unavailable.
  - Health/liveness snapshots can age between asynchronous observations; HTTP_ALIVE is not order authority.
  - Observed production timing, account recovery and Docker runtime remain unverified.
