  unique_feature_groups:
  - feature: Bounded durable store
    files:
    - runtime/store30.cjs
    - runtime/store.py
    functions:
    - DurableStore.rpc
    - DurableStore.fail
    - DurableStore.health
    - DurableStore.close
    - appendEvents
    - events
    difference: Adds RPC deadline, pending-request limit, process failure propagation, uncertain-write marker, bounded
      close and durable hash-chained event rows. Current 30.12 RPC lacks a deadline. Existing operation implementations
      retained.
    recommendation: 'First integration candidate: port bounded storage and review additive schema; test stalled
      child/uncertain ACK/backpressure/restart with current net ledger and observation archive. Do not claim storage
      failure leaves software-only protection operational.'
    tests_present_in_branch:
    - 'tools/v31_test.cjs: SIGSTOP storage'
    - 'tools/v31_test.cjs: audit beyond 300 events'
    - 'tools/v31_test.cjs: stalled SQLite releases coordinator mutex'
  - feature: Canonical execution authority
    files:
    - runtime/execution_authority.cjs
    - deploy/entry31.py
    - xxx/server.ts
    - xxx/coordinator.ts
    functions:
    - ExecutionAuthority.acquire
    - ExecutionAuthority.check
    - ExecutionAuthority.request
    - FencedApi
    - runtime_environment
    difference: Single service retains broker credentials and checks durable owner epoch immediately before broker
      mutation; persistent request ids prevent blind retry; Alpaca/futures share authority mutex.
    recommendation: Preserve as separate integration component until startup, streaming transport, store and reconciliation
      paths are tested together. Do not overwrite 30.12 server/installer. The branch disables streaming and changes
      credential topology.
  - feature: Portfolio stress and capital mandate
    files:
    - xxx/portfolio_guard.ts
    - xxx/coordinator.ts
    functions:
    - stressPortfolio
    - capitalAllowance
    difference: Gross factor exposure without inverse-ETF offset credit, full long-option premium risk and deterministic
      stress; explicit capital mandate for size staircase.
    recommendation: The pure risk calculator can be adapted after configuration/risk comparison; keep current account
      limits and default fixed capital. Do not activate capital expansion or treat policy shocks as calibrated VaR.
  - feature: Research accounting and bootstrap corrections
    files:
    - xxx/research_accounting.ts
    - xxx/ultimate_replay.ts
    - xxx/ultimate_stats.ts
    - xxx/ultimate_contracts.ts
    - research/ultimate/audit_recompute.cjs
    - research/ultimate/edge_batch.cjs
    functions:
