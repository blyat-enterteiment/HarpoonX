    - accountSnapshot
    - causalSize
    - dollarTradeMetrics
    - bootstrapEvidence
    difference: Decision-time sizing, pending capital reservation, cash PnL through partial exits, future-gap causality
      and bootstrap Monte Carlo tail precision.
    recommendation: Preserve corrected offline research and original reproduction artifacts separately. Do not replace
      the Quant1.8 paired NATIVE/RIDGE/SVR/CASH evidence gate, or promote results from previously observed windows.
  - feature: Options eligibility, data and budget
    files:
    - xxx/option_contracts.ts
    - xxx/option_data.ts
    - xxx/option_surface.ts
    - xxx/market.ts
    - xxx/plugins.ts
    - xxx/policy.ts
    functions:
