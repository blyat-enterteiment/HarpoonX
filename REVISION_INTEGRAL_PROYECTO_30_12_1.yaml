  contract:
    open: Returns a promise resolving to this store only after a valid real SQLite ping ACK. Concurrent calls share
      the opening promise and child. READY cannot precede that ACK. Existing current runtime/server/crypto/cloud
      callers await open and remain compatible.
    operation_compatibility:
    - get
    - put
    - batch
    - scan
    - scanAfter
    - scanFrom
    - atomic
    - lease
    - loadKeys
    - saveKeys
    acknowledgement: 'Exactly id plus either result or nonempty string error. Success result is validated against
      the pending operation: ping {ok:true}; batch true; CAS/lease boolean; scan up to 500 [string key, value] rows;
      get arbitrary JSON. Unknown/late IDs do not resolve pending work; malformed JSON never acknowledges it.'
    time: RPC expiry uses performance.now(), a monotonic clock, starting after local serialization and before enqueue/write.
      A valid ACK processed at or beyond deadline fails the store even if I/O ran before the overdue timer callback.
    timeout_ms:
      default: 2000
      minimum: 50
      maximum: 5000
      configuration: constructor options.timeoutMs or HARPOON_STORAGE_TIMEOUT_MS
    pending_limit: 2048
    overflow: Reject overflow and all outstanding operations, latch FAILED, mark pending mutations uncertain, terminate
      worker; do not retry.
    transport_failure: Process spawn/error/exit, stdin/write error, RPC expiry or invalid response latches FAILED,
      rejects pending operations, releases timers and terminates the child.
    uncertainWrite: Sticky true if a mutation was awaiting ACK when transport failed, ACK was invalid/late, or close
      began. Not proof the mutation committed or rolled back. A read-only failure does not invent uncertain writes.
    definite_errors: Serialization failure before send and explicit valid operation error ACK reject without inventing
      transport uncertainty.
    automatic_replay: false
    same_instance_reopen_after_failure_or_close: false
    atomic_retry: Existing up to four CAS attempts only after a valid false CAS result; no retry after lost/invalid/late
      ACK.
    reconciliation: A deliberately new store instance may inspect durable state after failed one is closed; caller
      must reconcile durable records and external exposure before resuming actions.
    close: Idempotent promise; reject pending RPCs and retain uncertainty; end input, then SIGKILL if close timeout
      elapses. CLOSED with uncertainWrite=true still requires reconciliation.
    schema: Existing records/leases schema retained; no audit_events or append_events ledger added.
    payload: No new smaller IPC byte limit. Existing upstream observation/registry limits remain unchanged. A 16
